# Pilot for Codie, Ravenous Codex, Combo-Control build (brew 2026-10-03). Same Seething Song loop as `codie`,
# with the slow prepare value creatures traded for wipes, spot removal, counters and tutors.
commander: Codie, Ravenous Codex
eyebrow: "Five-color · Prepare combo-control · Bracket 3"
summary: Interacts early with cheap removal, counters and wipes, then assembles Displacer Kitten or Codie + an untapper
  with Blazing Firesinger for infinite red into Flaming Tyrannosaurus, Impending Flux or a copied Exsanguinate.

engine: [Displacer Kitten, Blazing Firesinger, Chakram Retriever, Jeskai Ascendancy, Chromatic Orrery,
         Flaming Tyrannosaurus, Stensian Sanguinist, Archmage Emeritus, "Vega, the Watcher", "Kellan, the Kid",
         Cryptolith Rite, Song of Creation, Emeritus of Woe, Emeritus of Ideation, "Sanar, Unfinished Genius"]
keep_home: [Displacer Kitten, Blazing Firesinger, Chakram Retriever, Archmage Emeritus, "Vega, the Watcher",
            "Kellan, the Kid", Stensian Sanguinist, Storm-Kiln Artist, Bloom Tender, Faeburrow Elder, Birds of Paradise,
            Emeritus of Woe, Emeritus of Conflict, Flaming Tyrannosaurus, "Sanar, Unfinished Genius", Harmonized Trio,
            Heartwood Crafter, Studious First-Year]
keep_commander_home: true
commander_first: true

fodder: tokens
fodder_max_cmc: 2
instant_sac_tokens: []
bonus_keywords: []

# Loop pieces first; Enlightened Tutor and Chord find the rest.
tutor_targets: [Displacer Kitten, Blazing Firesinger, Flaming Tyrannosaurus, Chakram Retriever, Chromatic Orrery,
                Jeskai Ascendancy, Impending Flux]

