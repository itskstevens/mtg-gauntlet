# Pilot for Codie, Ravenous Codex, Prepared Reanimator build (brew 2026-10-03).
commander: Codie, Ravenous Codex
eyebrow: "Five-color · Prepare reanimator · Bracket 3"
summary: Mills and entombs fatties, then Codie copies prepared Reanimate, Bind to Life and Restore Relic to put two
  threats back at a time. Wins in combat with Archon of Cruelty, Atraxa, Elesh Norn and the Titans.

engine: [Grave Researcher, Vastlands Scavenger, Lorehold Archivist, Skycoach Conductor, Emeritus of Woe,
         Emeritus of Abundance, Survival of the Fittest, Archmage Emeritus, "Vega, the Watcher", Emeritus of Ideation,
         Paradox Shaper]
keep_home: [Grave Researcher, Vastlands Scavenger, Lorehold Archivist, Skycoach Conductor, Emeritus of Woe,
            Archmage Emeritus, "Vega, the Watcher", Paradox Shaper, Theorix Metamage, Void Extrapolator,
            Stitcher's Supplier, Bloom Tender, Faeburrow Elder, Birds of Paradise, Heartwood Crafter,
            Studious First-Year, Harmonized Trio]
keep_commander_home: true
commander_first: true

# Stitcher's Supplier is happy to die (its dies trigger is a bonus mill).
fodder: any
fodder_max_cmc: 2
instant_sac_tokens: []
bonus_keywords: []

# Tutors find the reanimation preparers; Entomb/Buried Alive pick fatties on their own.
tutor_targets: [Grave Researcher, Vastlands Scavenger, Archon of Cruelty, "Atraxa, Grand Unifier",
                "Elesh Norn, Grand Cenobite", Lorehold Archivist, Animate Dead]

