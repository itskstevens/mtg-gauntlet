# Pilot for Codie, Ravenous Codex, Self-Mill build (2026-10-04): mills its own library and wins with
# Doctor Doom, Unrivaled, Laboratory Maniac, Jace, Wielder of Mysteries or a reanimated Thassa's Oracle.
commander: Codie, Ravenous Codex
eyebrow: "Five-color · Prepare self-mill · Bracket 3"
summary: Mills its own library with copied Bind to Life, Omit Variables, Hedron Crab and Traumatize, then wins with
  Doctor Doom (tap with an empty library), Laboratory Maniac, Jace or a reanimated Thassa's Oracle.

