# Pilot for Sanar, Unfinished Genius (Izzet storm / combo-control). List from Kevin's Moxfield export, 2026-10-05.
commander: Sanar, Unfinished Genius
eyebrow: "Izzet · Treasure storm / combo-control · Bracket 4"
summary: Digs with cantrips and Wild Idea, holds up cheap counters, then assembles an infinite-Treasure loop (Xorn +
  Freed from the Real or Pemmin's Aura on Sanar, or Ioreth + Marvin) into Weftstalker Ardent or Reckless Fireweaver,
  Isochron Scepter + Dramatic Reversal, or a Displacer Kitten + Blazing Firesinger loop.

engine: ["Sanar, Unfinished Genius", Xorn, "Ioreth of the Healing House", "Marvin, Murderous Mimic",
         Freed from the Real, Pemmin's Aura, Isochron Scepter, Weftstalker Ardent, Reckless Fireweaver,
         Displacer Kitten, Blazing Firesinger, Storm-Kiln Artist, Archmage Emeritus, Underworld Breach,
         Galazeth Prismari]
keep_home: ["Sanar, Unfinished Genius", Xorn, "Ioreth of the Healing House", "Marvin, Murderous Mimic",
            Weftstalker Ardent, Reckless Fireweaver, Displacer Kitten, Blazing Firesinger, Storm-Kiln Artist,
            Archmage Emeritus, Galazeth Prismari, Goblin Electromancer, Molten-Core Maestro, Pensive Professor,
            Abstract Paintmage, Goblin Glasswright, Hexing Squelcher, Spellseeker]
keep_commander_home: true
commander_first: true

fodder: tokens
fodder_max_cmc: 1
instant_sac_tokens: []
bonus_keywords: []

# Combo pieces first. Spellseeker / Merchant Scroll / Solve the Equation / Wild Idea find spells only, so the
# engine falls through to the first legal target.
tutor_targets: [Dramatic Reversal, Isochron Scepter, Xorn, Freed from the Real, Pemmin's Aura, Weftstalker Ardent,
                Reckless Fireweaver, "Ioreth of the Healing House", "Marvin, Murderous Mimic", Displacer Kitten,
